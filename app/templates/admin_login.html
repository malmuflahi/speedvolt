{% extends "base.html" %}

{% block title %}Admin Login | SpeedVolt{% endblock %}

{% block content %}

<section class="page-hero">
    <p class="eyebrow">Admin Access</p>
    <h1>Sign in to manage orders.</h1>
    <p>Enter the admin password to view customer orders and invoice links.</p>
</section>

<section class="admin-login-wrap">
    <form method="POST" class="checkout-card admin-login-card">
        <label>Admin Password</label>
        <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            autofocus
        >

        <button type="submit" class="btn btn-primary full">Sign In</button>

        {% if error %}
        <p class="form-message error">{{ error }}</p>
        {% endif %}
    </form>
</section>

{% endblock %}
